<!DOCTYPE html>
<html>
<head>
    <title>Mapa de sucursales</title>
    <meta charset="UTF-8">
    <style>
        html, body, #mapa {
            height: 100%;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="mapa"></div>

    <script>
        var mapa;
        var geocoder;
        var marcadores = [];

        // Se ejecuta cuando Google Maps termina de cargar
        function initMap() {
            mapa = new google.maps.Map(document.getElementById("mapa"), {
                center: { lat: 40.4, lng: -3.7 },
                zoom: 6
            });
            geocoder = new google.maps.Geocoder();
        }

        // Borrar todos los marcadores
        function limpiarMapa() {
            for (var i = 0; i < marcadores.length; i++) {
                marcadores[i].setMap(null);
            }
            marcadores = [];
        }

        // Añadir una sucursal buscando su dirección
        function agregarSucursal(id, direccion, localidad) {
            var texto = direccion + ", " + localidad + ", España";

            geocoder.geocode({ address: texto }, function (resultados, estado) {
                if (estado === "OK") {
                    var posicion = resultados[0].geometry.location;

                    var marcador = new google.maps.Marker({
                        position: posicion,
                        map: mapa,
                        title: "Sucursal " + id
                    });

                    var ventana = new google.maps.InfoWindow({
                        content: "<b>Sucursal " + id + "</b><br>" + direccion
                    });
                    marcador.addListener("click", function () {
                        ventana.open(mapa, marcador);
                    });

                    marcadores.push(marcador);
                    mapa.setCenter(posicion);
                    mapa.setZoom(13);
                } else {
                    console.log("No se encontró: " + texto);
                }
            });
        }

        // Centrar el mapa en una dirección
        function enfocarUbicacion(direccion, localidad) {
            var texto = direccion + ", " + localidad + ", España";

            geocoder.geocode({ address: texto }, function (resultados, estado) {
                if (estado === "OK") {
                    mapa.setCenter(resultados[0].geometry.location);
                    mapa.setZoom(15);
                }
            });
        }
    </script>

    <!-- Cambia TU_API_KEY por tu clave de Google Maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY&callback=initMap"></script>
</body>
</html>
