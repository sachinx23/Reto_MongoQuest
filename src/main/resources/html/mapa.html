<!DOCTYPE html>
<html>
<head>
    <title>Mapa de sucursales</title>
    <meta charset="UTF-8">
    <!-- OpenStreetMap con Leaflet: gratis y sin clave (Google Maps pide una clave de pago) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #mapa {
            height: 100%;
            margin: 0;
        }
        #aviso {
            font-family: "Segoe UI", sans-serif;
            color: #64748B;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="mapa"></div>

    <script>
        var mapa = null;
        var marcadores = [];

        // Crea el mapa centrado en España
        function initMap() {
            if (typeof L === "undefined") {
                // Sin internet no se puede cargar Leaflet
                document.getElementById("mapa").innerHTML = "<div id='aviso'>No se pudo cargar el mapa (comprueba la conexión a internet).</div>";
                return;
            }
            mapa = L.map("mapa").setView([40.4, -3.7], 6);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap"
            }).addTo(mapa);
        }

        // La llama Java cuando termina de cargar la página: deja el mapa listo
        function refrescarMapa() {
            if (mapa === null) {
                initMap();
            }
            if (mapa !== null) {
                mapa.invalidateSize();
            }
        }

        // Busca las coordenadas de una dirección en OpenStreetMap (Nominatim)
        function buscarDireccion(texto, alEncontrar) {
            var peticion = new XMLHttpRequest();
            peticion.open("GET", "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(texto));
            peticion.onload = function () {
                if (peticion.status === 200) {
                    var resultados = JSON.parse(peticion.responseText);
                    if (resultados.length > 0) {
                        alEncontrar([parseFloat(resultados[0].lat), parseFloat(resultados[0].lon)]);
                    }
                }
            };
            peticion.send();
        }

        // Borra todos los marcadores
        function limpiarMapa() {
            if (mapa === null) {
                return;
            }
            for (var i = 0; i < marcadores.length; i++) {
                mapa.removeLayer(marcadores[i]);
            }
            marcadores = [];
        }

        // Añade una sucursal buscando su dirección
        function agregarSucursal(id, direccion, localidad) {
            if (mapa === null) {
                return;
            }
            buscarDireccion(direccion + ", " + localidad + ", España", function (posicion) {
                var marcador = L.marker(posicion).addTo(mapa);
                marcador.bindPopup("<b>Sucursal " + id + "</b><br>" + direccion + ", " + localidad);
                marcadores.push(marcador);
                mapa.setView(posicion, 13);
            });
        }

        // Centra el mapa en una dirección
        function enfocarUbicacion(direccion, localidad) {
            if (mapa === null) {
                return;
            }
            buscarDireccion(direccion + ", " + localidad + ", España", function (posicion) {
                mapa.setView(posicion, 16);
            });
        }

        initMap();
    </script>
</body>
</html>
