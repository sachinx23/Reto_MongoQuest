<!DOCTYPE html>
<html>
    <head>
        <title>Mapa de sucursales</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Leaflet: librería de mapas -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <style>
            html, body, #mapa {
                height: 100%;
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <div id="mapa"></div>

        <script>
            // Inicializar mapa
            var mapa = L.map('mapa').setView([40.4, -3.7], 6);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
            }).addTo(mapa);

            // Capa para almacenar todos los marcadores
            var marcadoresGroup = L.layerGroup().addTo(mapa);

            // 1. Corregir el recuadro gris cuando se redimensiona el componente en Java
            function refrescarMapa() {
            setTimeout(function() {
            mapa.invalidateSize();
            }, 200);
            }

            // Llamar al redimensionar la ventana
            window.onresize = function() {
            refrescarMapa();
            };

            // 2. Limpiar todos los marcadores del mapa
            function limpiarMapa() {
            marcadoresGroup.clearLayers();
            }

            // 3. Añadir una sucursal al mapa por dirección
            // Función para añadir marcador haciendo geocodificación de la dirección
            function agregarSucursal(id, direccion, localidad) {
            var direccionCompleta = direccion + ", " + localidad + ", España";

            // Consulta a Nominatim para obtener latitud y longitud
            fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(direccionCompleta))
            .then(response => response.json())
            .then(data => {
            if (data && data.length > 0) {
            var lat = parseFloat(data[0].lat);
            var lon = parseFloat(data[0].lon);

            // Crear y añadir el marcador al mapa
            var marker = L.marker([lat, lon]).addTo(map);
            marker.bindPopup("<b>Sucursal " + id + "</b><br>" + direccion);

            // Centrar el mapa en el nuevo marcador
            map.setView([lat, lon], 13);
            } else {
            console.warn("No se encontraron coordenadas para: " + direccionCompleta);
            }
            })
            .catch(error => console.error("Error al geocodificar dirección:", error));
            }

            // 4. Enfocar una sucursal específica (al hacer clic en la lista)
            function enfocarUbicacion(direccion, localidad) {
            var busqueda = direccion + ', ' + localidad;
            var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' 
            + encodeURIComponent(busqueda);

            var peticion = new XMLHttpRequest();
            peticion.open('GET', url, true);
            peticion.onreadystatechange = function () {
            if (peticion.readyState === 4 && peticion.status === 200) {
            var resultados = JSON.parse(peticion.responseText);
            if (resultados.length > 0) {
            var lat = parseFloat(resultados[0].lat);
            var lon = parseFloat(resultados[0].lon);
            mapa.setView([lat, lon], 15);
            }
            }
            };
            peticion.send();
            }
        </script>
    </body>
</html>
