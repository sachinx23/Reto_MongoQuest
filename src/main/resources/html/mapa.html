<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #mapa {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    
    
    <iframe id="mapa" src="https://maps.google.com/maps?q=España&output=embed"></iframe>

    <script>
        // Funciones vacías obligatorias para que el controlador de JavaFX no de errores
        function refrescarMapa() {}
        function limpiarMapa() {}
        function agregarSucursal(id, direccion, localidad) {}

        // Función ultracorta para actualizar el mapa al hacer clic en la lista
        function enfocarUbicacion(direccion, localidad) {
            var direccionCompleta = direccion + ", " + localidad;
            var url = "https://maps.google.com/maps?q=" + encodeURIComponent(direccionCompleta) + "&output=embed";
            document.getElementById('mapa').src = url;
        }
    </script>

</body>
</html>
