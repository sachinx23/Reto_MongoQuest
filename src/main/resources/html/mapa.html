<!DOCTYPE html>
<html>
<head>
    <title>Mapa de Sucursales</title>
    <meta charset="UTF-8">
    <!-- Mapa con OpenStreetMap (Leaflet): no necesita API key -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #mapa {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="mapa"></div>

    <script>
        var mapa = null;
        var marcadores = [];
        if (typeof L === "undefined") {
            document.getElementById("mapa").innerHTML =
                    "<p style='font-family:sans-serif;padding:20px'>No se ha podido cargar el mapa. Comprueba la conexión a internet.</p>";
        } else {
            mapa = L.map("mapa").setView([43.263, -2.935], 11);
            // Mapa de calles de Esri (gratis, sin API key)
            L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
                maxZoom: 19,
                attribution: "Tiles &copy; Esri"
            }).addTo(mapa);
        }
        var cola = [];
        var ocupado = false;

        // Busca las coordenadas de una dirección (de una en una)
        function buscar(texto, alTerminar) {
            cola.push({ texto: texto, alTerminar: alTerminar });
            siguiente();
        }

        function siguiente() {
            if (mapa === null || ocupado || cola.length === 0) {
                return;
            }
            ocupado = true;
            var tarea = cola.shift();
            var xhr = new XMLHttpRequest();
            // Buscador de direcciones de Esri (gratis, sin API key)
            xhr.open("GET", "https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates"
                    + "?f=json&maxLocations=1&countryCode=ESP&SingleLine=" + encodeURIComponent(tarea.texto));
            xhr.onload = function () {
                var datos = null;
                try {
                    datos = JSON.parse(xhr.responseText);
                } catch (e) {
                }
                if (datos !== null && datos.candidates && datos.candidates.length > 0) {
                    var punto = datos.candidates[0].location;
                    tarea.alTerminar([punto.y, punto.x]);
                } else {
                    console.log("No se encontró: " + tarea.texto);
                }
                ocupado = false;
                siguiente();
            };
            xhr.onerror = function () {
                ocupado = false;
                siguiente();
            };
            xhr.send();
        }

        // Llamado desde JavaFX al terminar de cargar el WebView
        function refrescarMapa() {
            if (mapa !== null) {
                mapa.invalidateSize();
            }
        }

        // Limpia todos los marcadores actuales del mapa
        function limpiarMapa() {
            for (var i = 0; i < marcadores.length; i++) {
                mapa.removeLayer(marcadores[i]);
            }
            marcadores = [];
        }

        // Añade una sucursal buscando su dirección
        function agregarSucursal(id, direccion, localidad) {
            buscar(direccion + ", " + localidad, function (posicion) {
                var marcador = L.marker(posicion).addTo(mapa)
                        .bindPopup("<b>Sucursal " + id + "</b><br>" + direccion);
                marcadores.push(marcador);
            });
        }

        // Centra y hace zoom en la sucursal seleccionada desde la lista de JavaFX
        function enfocarUbicacion(direccion, localidad) {
            buscar(direccion + ", " + localidad, function (posicion) {
                mapa.setView(posicion, 16);
            });
        }
    </script>
</body>
</html>
